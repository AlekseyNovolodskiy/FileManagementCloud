<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Страница пользователя</title>
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
<div class="dashboard">
    <!-- ЛЕВАЯ КОЛОНКА - ТОЛЬКО ССЫЛКИ -->
    <div class="sidebar">
        <div class="user-info">
            <div class="user-avatar">
                <span th:text="${#strings.substring(userDto.firstName, 0, 1)}">A</span>
            </div>
            <div class="user-name" th:text="${userDto.firstName + ' ' + userDto.lastName}">User Name</div>
            <div class="user-email" th:text="${userDto.email}">user@example.com</div>
        </div>

        <!-- ✅ ПРЯМЫЕ ССЫЛКИ - без JS -->
        <div class="nav-menu">
            <a href="/main-page" class="nav-link active">
                <i class="fas fa-home"></i> Главная
            </a>
            <a href="/locations" class="nav-link">
                <i class="fas fa-map-marker-alt"></i> Мои локации
            </a>
            <a href="/weather" class="nav-link">
                <i class="fas fa-cloud-sun"></i> Погода
            </a>
            <!-- ✅ ТОЛЬКО ЭТА КНОПКА БУДЕТ ЗАГРУЖАТЬ СПИСОК СПРАВА -->
            <button id="filesBtn" class="nav-link" style="width: 100%; text-align: left;">
                <i class="fas fa-file"></i> Мои файлы
            </button>
            <a href="/settings" class="nav-link">
                <i class="fas fa-cog"></i> Настройки
            </a>
        </div>

        <div class="location-counter">
            <div style="display: flex; justify-content: space-between;">
                <span>Выбрано локаций:</span>
                <span class="counter" th:text="${locationCount}">0</span>
            </div>
            <div style="margin-top: 10px;">
                <span>Максимум: 5</span>
                <div class="progress-bar">
                    <div class="progress-fill" style="width: ${(locationCount / 5) * 100}%;"></div>
                </div>
            </div>
        </div>

        <form action="/logout" method="post" style="margin-top: 20px;">
            <button type="submit" class="nav-link" style="color: #f44336; width: 100%; text-align: left;">
                <i class="fas fa-sign-out-alt"></i> Выйти
            </button>
        </form>
    </div>

    <!-- ПРАВАЯ КОЛОНКА - Контент -->
    <div class="content" id="content-frame">
        <div class="content-header">
            <h2 class="content-title" id="content-title">Главная</h2>
        </div>
        <div class="content-body" id="content-body">
            <!-- Контент по умолчанию -->
            <div style="text-align: center; padding: 40px 20px;">
                <i class="fas fa-cloud-sun" style="font-size: 80px; color: #667eea; margin-bottom: 20px;"></i>
                <h3 style="color: #333; margin-bottom: 20px;">Добро пожаловать в погодное приложение!</h3>
                <p style="color: #666; max-width: 600px; margin: 0 auto;">
                    Используйте меню слева для навигации.
                </p>
            </div>
        </div>
    </div>
</div>

<!-- ✅ МИНИМАЛЬНЫЙ JS - ТОЛЬКО ДЛЯ КНОПКИ МОИ ФАЙЛЫ -->
<script>
    document.getElementById('filesBtn').addEventListener('click', function() {
        const contentTitle = document.getElementById('content-title');
        const contentBody = document.getElementById('content-body');

        contentTitle.textContent = 'Мои файлы';

        // Загружаем список файлов
        fetch('/files/list')
            .then(response => response.json())
            .then(files => {
                if (files.length === 0) {
                    contentBody.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-file"></i>
                            <h3>У вас пока нет файлов</h3>
                            <p>Загрузите ваш первый файл!</p>
                        </div>
                    `;
                } else {
                    let html = '<div class="files-grid">';
                    files.forEach(file => {
                        html += `
                            <div class="file-card">
                                <div class="file-icon">📄</div>
                                <div class="file-name">${file}</div>
                                <div class="file-actions">
                                    <a href="/files/download/${file}" class="btn btn-outline">
                                        <i class="fas fa-download"></i>
                                    </a>
                                </div>
                            </div>
                        `;
                    });
                    html += '</div>';
                    contentBody.innerHTML = html;
                }
            })
            .catch(error => {
                contentBody.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-exclamation-circle"></i>
                        <h3>Ошибка загрузки</h3>
                        <p>Не удалось получить список файлов</p>
                    </div>
                `;
            });
    });
</script>

<style>
    /* Стили для навигационных ссылок */
    .nav-link {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 15px;
        border: none;
        background: none;
        width: 100%;
        text-align: left;
        font-size: 16px;
        color: #555;
        border-radius: 10px;
        cursor: pointer;
        transition: all 0.3s ease;
        text-decoration: none;
    }

    .nav-link:hover {
        background: linear-gradient(135deg, #667eea20, #764ba220);
        color: #667eea;
        transform: translateX(5px);
    }

    .nav-link.active {
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: white;
    }

    .nav-link i {
        width: 24px;
        font-size: 18px;
    }

    .progress-bar {
        width: 100%;
        background: #eee;
        height: 6px;
        border-radius: 3px;
        margin-top: 5px;
    }

    .progress-fill {
        background: linear-gradient(135deg, #667eea, #764ba2);
        height: 6px;
        border-radius: 3px;
        transition: width 0.3s ease;
    }

    .files-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 20px;
        margin-top: 20px;
    }

    .file-card {
        background: #f8f9fa;
        border-radius: 10px;
        padding: 20px;
        text-align: center;
        border: 1px solid #eee;
        transition: all 0.3s ease;
    }

    .file-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 5px 15px rgba(102, 126, 234, 0.2);
    }

    .file-icon {
        font-size: 36px;
        margin-bottom: 10px;
    }

    .file-name {
        font-size: 14px;
        word-break: break-all;
        margin-bottom: 15px;
        color: #333;
    }

    .file-actions {
        display: flex;
        justify-content: center;
    }
</style>
</body>
</html>
