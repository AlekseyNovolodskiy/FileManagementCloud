<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Мой облачный диск</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* ===== ОСНОВНЫЕ СТИЛИ ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #f5f5f5;
        }

        .dashboard {
            display: flex;
            min-height: 100vh;
        }

        /* ===== САЙДБАР ===== */
        .sidebar {
            width: 280px;
            background: white;
            box-shadow: 2px 0 10px rgba(0,0,0,0.05);
            padding: 20px;
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
        }

        .user-info {
            text-align: center;
            padding: 20px 0;
            border-bottom: 1px solid #eee;
        }

        .user-avatar {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 50%;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 32px;
            font-weight: bold;
        }

        .user-name {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .user-email {
            font-size: 14px;
            color: #666;
        }

        .nav-menu {
            flex: 1;
            margin-top: 30px;
        }

        .nav-link {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            color: #666;
            text-decoration: none;
            border-radius: 10px;
            margin-bottom: 5px;
            transition: all 0.3s;
            width: 100%;
            border: none;
            background: none;
            font-size: 15px;
            cursor: pointer;
        }

        .nav-link i {
            width: 24px;
            margin-right: 10px;
            font-size: 18px;
        }

        .nav-link:hover {
            background: #f8f9fa;
            color: #667eea;
        }

        .nav-link.active {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .nav-section {
            font-size: 11px;
            color: #999;
            margin: 20px 0 5px 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .file-row {
            display: flex;
            gap: 10px;
            margin: 10px 0 20px;
        }

        .file-btn {
            flex: 1;
            padding: 10px;
            border: 1px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            text-decoration: none;
        }

        .file-btn:hover {
            background: #667eea;
            color: white;
        }

        .location-counter {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
        }

        .progress-bar {
            height: 6px;
            background: #e0e0e0;
            border-radius: 3px;
            margin-top: 5px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 3px;
            transition: width 0.3s;
        }

        /* ===== КОНТЕНТ ===== */
        .content {
            flex: 1;
            margin-left: 280px;
            background: #fafafa;
            padding: 20px;
            min-height: 100vh;
        }

        .iframe-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            height: calc(100vh - 40px);
            overflow: hidden;
            border: 1px solid #e0e0e0;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: white;
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
            }

            .content {
                margin-left: 0;
            }

            .dashboard {
                flex-direction: column;
            }

            .iframe-container {
                height: calc(100vh - 320px);
            }
        }
    </style>
</head>
<body>
<div class="dashboard">
    <!-- САЙДБАР -->
    <div class="sidebar">
        <div class="user-info">
            <div class="user-avatar">
                <span th:text="${userDto != null ? #strings.substring(userDto.firstName, 0, 1) : 'U'}">U</span>
            </div>
            <div class="user-name"
                 th:text="${userDto != null ? userDto.firstName + ' ' + userDto.lastName : 'Пользователь'}">
                Пользователь
            </div>
            <div class="user-email" th:text="${userDto != null ? userDto.email : 'user@example.com'}">
                user@example.com
            </div>
        </div>

        <div class="nav-menu">
            <div class="nav-section">НАВИГАЦИЯ</div>

            <!-- Кнопки навигации - открываются в iframe -->
            <a href="/ui/folders" target="content-frame" class="nav-link" onclick="setActive(this)">
                <i class="fas fa-home"></i> Главная
            </a>

            <div class="nav-section">ДЕЙСТВИЯ</div>

            <div class="file-row">
                <a href="#" onclick="document.getElementById('fileUpload').click(); return false;" class="file-btn">
                    <i class="fas fa-upload"></i> Загрузить
                </a>
                <a href="#" onclick="refreshIframe(); return false;" class="file-btn">
                    <i class="fas fa-sync-alt"></i> Обновить
                </a>
            </div>

            <!-- ФОРМА ЗАГРУЗКИ - ИСПРАВЛЕНО -->
            <form id="uploadForm" action="/main/upload/root" method="post" enctype="multipart/form-data" target="content-frame">
                <input type="file" id="fileUpload" name="file" style="display: none;" />
            </form>
        </div>

        <div class="location-counter">
            <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                <span><i class="fas fa-map-marker-alt" style="color: #667eea;"></i> Использовано локаций:</span>
                <span class="counter" th:text="${locationCount != null ? locationCount : 0}">0</span>
            </div>
            <div>из 5 доступных</div>
            <div class="progress-bar">
                <div class="progress-fill"
                     th:style="'width: ' + (${locationCount != null ? (locationCount / 5) * 100 : 0}) + '%;'">
                </div>
            </div>
        </div>

        <form action="/logout" method="post" style="margin-top: 20px;">
            <button type="submit" class="nav-link" style="color: #f44336;">
                <i class="fas fa-sign-out-alt"></i> Выйти
            </button>
        </form>
    </div>

    <!-- ОСНОВНОЙ КОНТЕНТ - IFRAME -->
    <div class="content">
        <div class="iframe-container">
            <iframe name="content-frame" id="content-frame"
                    src="/ui/folders"
                    frameborder="0"></iframe>
        </div>
    </div>
</div>

<!-- ВЕСЬ JAVASCRIPT В ОДНОМ МЕСТЕ -->
<script>
    // Функция обновления iframe
    function refreshIframe() {
        const iframe = document.getElementById('content-frame');
        iframe.src = iframe.src;
        console.log('Iframe обновлен');
    }

    // Функция для подсветки активного пункта меню
    function setActive(element) {
        document.querySelectorAll('.nav-link').forEach(link => {
            link.classList.remove('active');
        });
        element.classList.add('active');
    }

    // ПОЛНАЯ ФУНКЦИЯ ЗАГРУЗКИ
    function submitUploadForm() {
        const fileInput = document.getElementById('fileUpload');

        if (!fileInput.files || fileInput.files.length === 0) {
            alert('Выберите файл');
            return;
        }

        const file = fileInput.files[0];
        console.log('📁 Выбран файл:', file.name);

        // Получаем текущий folderId из iframe
        let folderId = 'root';
        try {
            const iframe = document.getElementById('content-frame');
            const iframeUrl = iframe.contentWindow.location.pathname;
            console.log('URL iframe:', iframeUrl);

            if (iframeUrl.includes('/ui/folders/')) {
                folderId = iframeUrl.split('/ui/folders/')[1];
            } else if (iframeUrl.includes('/ui/display-files/')) {
                folderId = iframeUrl.split('/ui/display-files/')[1];
            }
        } catch (e) {
            console.log('Не удалось получить URL iframe:', e);
        }

        // Обновляем action формы
        const form = document.getElementById('uploadForm');
        form.action = '/main/upload/' + folderId;

        console.log('🚀 Отправка файла в папку:', folderId);
        console.log('📤 URL:', form.action);

        // Отправляем форму
        form.submit();

        // Показываем сообщение
        alert('Загрузка файла ' + file.name + ' в папку ' + folderId);
    }

    // Привязываем функцию к событию change
    document.addEventListener('DOMContentLoaded', function() {
        const fileInput = document.getElementById('fileUpload');
        if (fileInput) {
            fileInput.addEventListener('change', submitUploadForm);
        }

        // Устанавливаем активный пункт меню
        document.querySelector('a[href="/ui/folders"]').classList.add('active');
    });
</script>
</body>
</html>
