<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Страница пользователя</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* ===== ОСНОВНЫЕ СТИЛИ ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #f5f5f5;
        }

        .dashboard {
            display: flex;
            min-height: 100vh;
        }

        /* ===== САЙДБАР ===== */
        .sidebar {
            width: 280px;
            background: white;
            box-shadow: 2px 0 10px rgba(0,0,0,0.05);
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .user-info {
            text-align: center;
            padding: 20px 0;
            border-bottom: 1px solid #eee;
        }

        .user-avatar {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 50%;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 32px;
            font-weight: bold;
        }

        .user-name {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .user-email {
            font-size: 14px;
            color: #666;
        }

        .nav-menu {
            flex: 1;
            margin-top: 30px;
        }

        .nav-link {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            color: #666;
            text-decoration: none;
            border-radius: 10px;
            margin-bottom: 5px;
            transition: all 0.3s;
            width: 100%;
            border: none;
            background: none;
            font-size: 15px;
            cursor: pointer;
        }

        .nav-link i {
            width: 24px;
            margin-right: 10px;
            font-size: 18px;
        }

        .nav-link:hover {
            background: #f8f9fa;
            color: #667eea;
        }

        .nav-link.active {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .file-row {
            display: flex;
            gap: 10px;
            margin: 10px 0 20px;
        }

        .file-btn {
            flex: 1;
            padding: 10px;
            border: 1px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .file-btn:hover {
            background: #667eea;
            color: white;
        }

        .file-btn.active {
            background: #667eea;
            color: white;
        }

        .location-counter {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
        }

        .progress-bar {
            height: 6px;
            background: #e0e0e0;
            border-radius: 3px;
            margin-top: 5px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 3px;
            transition: width 0.3s;
        }

        /* ===== КОНТЕНТ ===== */
        .content {
            flex: 1;
            background: #fafafa;
            padding: 30px;
            overflow-y: auto;
        }

        .content-header {
            margin-bottom: 30px;
        }

        .content-title {
            font-size: 28px;
            color: #333;
            font-weight: 600;
        }

        /* ===== СТИЛИ ДЛЯ ФАЙЛОВ ===== */
        .upload-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }

        .upload-area {
            background: white;
            border: 2px dashed #667eea;
            border-radius: 15px;
            padding: 40px 20px;
            text-align: center;
            transition: all 0.3s ease;
            margin-bottom: 30px;
        }

        .upload-area:hover {
            border-color: #764ba2;
            background: linear-gradient(135deg, #667eea10, #764ba210);
        }

        .upload-area i {
            font-size: 48px;
            color: #667eea;
            margin-bottom: 15px;
        }

        .upload-area h3 {
            font-size: 20px;
            color: #333;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .upload-area p {
            color: #666;
            margin-bottom: 20px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .files-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .file-card {
            background: white;
            border: 1px solid #eee;
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s ease;
            position: relative;
            text-align: center;
        }

        .file-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.15);
        }

        .file-icon {
            font-size: 36px;
            margin-bottom: 12px;
        }

        .file-name {
            font-size: 14px;
            color: #333;
            word-break: break-all;
            margin-bottom: 15px;
            font-weight: 500;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            background: white;
            border-radius: 12px;
            margin-top: 20px;
        }

        .empty-state i {
            font-size: 64px;
            color: #ddd;
            margin-bottom: 20px;
        }

        .empty-state h3 {
            color: #333;
            margin-bottom: 10px;
            font-size: 20px;
        }

        .empty-state p {
            color: #666;
            margin-bottom: 25px;
        }
    </style>
</head>
<body>
<div class="dashboard">
    <!-- ЛЕВАЯ КОЛОНКА -->
    <div class="sidebar">
        <div class="user-info">
            <div class="user-avatar">
                <span th:text="${userDto != null ? #strings.substring(userDto.firstName, 0, 1) : 'U'}">U</span>
            </div>
            <div class="user-name"
                 th:text="${userDto != null ? userDto.firstName + ' ' + userDto.lastName : 'Пользователь'}">
                Пользователь
            </div>
            <div class="user-email" th:text="${userDto != null ? userDto.email : 'user@example.com'}">
                user@example.com
            </div>
        </div>

        <div class="nav-menu">
            <!-- Главная кнопка -->
            <button id="homeBtn" class="nav-link active">
                <i class="fas fa-home"></i> Главная
            </button>

            <div style="font-size: 11px; color: #999; margin: 10px 0 5px 10px;">ФАЙЛЫ</div>

            <div class="file-row">
                <button id="uploadBtn" class="file-btn">
                    <i class="fas fa-upload"></i> Загрузить
                </button>
                <button id="filesBtn" class="file-btn">
                    <i class="fas fa-list"></i> Список
                </button>
            </div>
        </div>

        <div class="location-counter">
            <div style="display: flex; justify-content: space-between;">
                <span>Выбрано локаций:</span>
                <span class="counter" th:text="${locationCount != null ? locationCount : 0}">0</span>
            </div>
            <div style="margin-top: 10px;">
                <span>Максимум: 5</span>
                <div class="progress-bar">
                    <div class="progress-fill"
                         th:style="'width: ' + (${locationCount != null ? (locationCount / 5) * 100 : 0}) + '%;'">
                    </div>
                </div>
            </div>
        </div>

        <form action="/logout" method="post" style="margin-top: 20px;">
            <button type="submit" class="nav-link" style="color: #f44336;">
                <i class="fas fa-sign-out-alt"></i> Выйти
            </button>
        </form>
    </div>

    <!-- ПРАВАЯ КОЛОНКА -->
    <div class="content" id="content-frame">
        <div class="content-header">
            <h2 class="content-title" id="content-title">Главная</h2>
        </div>
        <div class="content-body" id="content-body">
            <div style="text-align: center; padding: 40px 20px;">
                <i class="fas fa-cloud-sun" style="font-size: 80px; color: #667eea; margin-bottom: 20px;"></i>
                <h3 style="color: #333; margin-bottom: 20px;">Добро пожаловать в облачное хранилище!</h3>
                <p style="color: #666; max-width: 600px; margin: 0 auto;">
                    Используйте меню слева для навигации.
                </p>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const homeBtn = document.getElementById('homeBtn');
        const uploadBtn = document.getElementById('uploadBtn');
        const filesBtn = document.getElementById('filesBtn');
        const contentTitle = document.getElementById('content-title');
        const contentBody = document.getElementById('content-body');

        function removeActiveClass() {
            document.querySelectorAll('.nav-link, .file-btn').forEach(btn => {
                btn.classList.remove('active');
            });
        }

        // Главная кнопка
        if (homeBtn) {
            homeBtn.addEventListener('click', function() {
                removeActiveClass();
                this.classList.add('active');

                contentTitle.textContent = 'Главная';
                contentBody.innerHTML = `
                    <div style="text-align: center; padding: 40px 20px;">
                        <i class="fas fa-cloud-sun" style="font-size: 80px; color: #667eea; margin-bottom: 20px;"></i>
                        <h3 style="color: #333; margin-bottom: 20px;">Добро пожаловать в облачное хранилище!</h3>
                        <p style="color: #666; max-width: 600px; margin: 0 auto;">
                            Используйте меню слева для навигации.
                        </p>
                    </div>
                `;
            });
        }

        // Кнопка загрузки
        if (uploadBtn) {
            uploadBtn.addEventListener('click', function() {
                removeActiveClass();
                this.classList.add('active');

                contentTitle.textContent = 'Загрузка файла';
                contentBody.innerHTML = `
                    <div class="upload-container">
                        <div class="upload-area">
                            <i class="fas fa-cloud-upload-alt"></i>
                            <h3>Загрузить новый файл</h3>
                            <p>Выберите файл для загрузки</p>

                            <form action="/main/upload" method="POST" enctype="multipart/form-data">
                                <input type="file" name="file" required style="margin: 10px 0;">
                                <button type="submit" class="btn-primary">
                                    <i class="fas fa-upload"></i> Загрузить
                                </button>
                            </form>
                        </div>
                    </div>
                `;
            });
        }

        // Кнопка списка файлов
if (filesBtn) {
    filesBtn.addEventListener('click', function() {
        removeActiveClass();
        this.classList.add('active');

        contentTitle.textContent = 'Мои файлы';
        contentBody.innerHTML = '<div class="empty-state"><i class="fas fa-spinner fa-spin"></i><h3>Загрузка...</h3></div>';

        // Добавим таймаут и обработку ошибок
        fetch('/main/all-files', {
            method: 'GET',
            headers: {
                'Accept': 'application/json',
                'Content-Type': 'application/json'
            }
        })
        .then(response => {
            console.log('Статус ответа:', response.status);
            if (!response.ok) {
                throw new Error('Ошибка сервера: ' + response.status);
            }
            return response.json();
        })
        .then(files => {
            console.log('Получены файлы:', files);

            if (!files || files.length === 0) {
                contentBody.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-file"></i>
                        <h3>У вас пока нет файлов</h3>
                        <p>Нажмите "Загрузить" чтобы добавить первый файл</p>
                    </div>
                `;
            } else {
                let html = '<div class="files-grid">';
                files.forEach(file => {
                    html += `
    <div class="file-card">
        <div class="file-icon">📄</div>
        <div class="file-name">${file}</div>
        <a href="/main/download?fileName=${encodeURIComponent(file)}"
           class="btn-primary"
           style="font-size: 12px; padding: 8px 16px; text-decoration: none; display: inline-block;">
            <i class="fas fa-download"></i> Скачать
        </a>
    </div>
`;
                });
                html += '</div>';
                contentBody.innerHTML = html;
            }
        })
        .catch(error => {
            console.error('Ошибка:', error);
            contentBody.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-exclamation-circle"></i>
                    <h3>Ошибка загрузки списка файлов</h3>
                    <p>${error.message}</p>
                    <button onclick="location.reload()" class="btn-primary" style="margin-top: 20px;">Обновить страницу</button>
                </div>
            `;
        });
    });
}
    });
</script>
</body>
</html>
