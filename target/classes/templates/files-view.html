<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${currentFolderName != null ? currentFolderName : 'Файлы'}">Файлы в папке</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            padding: 30px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #f0f0f0;
        }

        .header h1 {
            margin: 0;
            color: #333;
            font-size: 28px;
        }

        .folder-info {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
        }

        .folder-info h2 {
            margin: 0 0 10px 0;
            font-size: 24px;
        }

        .folder-info p {
            margin: 5px 0;
            opacity: 0.9;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid #e0e0e0;
        }

        .stat-card i {
            font-size: 32px;
            color: #667eea;
            margin-bottom: 10px;
        }

        .stat-card .value {
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }

        .stat-card .label {
            font-size: 14px;
            color: #666;
            margin-top: 5px;
        }

        .files-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .file-card {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            padding: 20px;
            transition: all 0.3s ease;
            position: relative;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .file-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.2);
            border-color: #667eea;
        }

        .file-icon {
            font-size: 48px;
            text-align: center;
            margin-bottom: 15px;
        }

        .file-name {
            font-weight: 600;
            color: #333;
            text-align: center;
            word-break: break-word;
            margin-bottom: 10px;
            font-size: 16px;
        }

        .file-meta {
            font-size: 12px;
            color: #666;
            text-align: center;
            margin-bottom: 15px;
            padding: 5px 0;
            border-top: 1px solid #f0f0f0;
            border-bottom: 1px solid #f0f0f0;
        }

        .file-actions {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .btn-download {
            background: #4CAF50;
            color: white;
        }

        .btn-download:hover {
            background: #45a049;
            transform: translateY(-2px);
            box-shadow: 0 2px 8px rgba(76, 175, 80, 0.3);
        }

        .btn-delete {
            background: #f44336;
            color: white;
        }

        .btn-delete:hover {
            background: #da190b;
            transform: translateY(-2px);
            box-shadow: 0 2px 8px rgba(244, 67, 54, 0.3);
        }

        .btn-back {
            background: #667eea;
            color: white;
            padding: 12px 24px;
            font-size: 16px;
        }

        .btn-back:hover {
            background: #5a67d8;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            background: #f8f9fa;
            border-radius: 10px;
            margin: 30px 0;
        }

        .empty-state i {
            font-size: 64px;
            color: #ddd;
            margin-bottom: 20px;
        }

        .empty-state h3 {
            color: #333;
            margin-bottom: 10px;
        }

        .empty-state p {
            color: #666;
            margin-bottom: 20px;
        }

        .breadcrumb {
            margin-bottom: 20px;
            padding: 10px 0;
        }

        .breadcrumb a {
            color: #667eea;
            text-decoration: none;
            margin-right: 10px;
        }

        .breadcrumb a:hover {
            text-decoration: underline;
        }

        .breadcrumb span {
            color: #999;
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
<div class="container">
    <!-- Хлебные крошки -->
    <div class="breadcrumb">
        <a href="/ui/folders"><i class="fas fa-home"></i> Главная</a>
        <span>›</span>
        <span th:text="${currentFolderName != null ? currentFolderName : 'Текущая папка'}">Папка</span>
    </div>

    <!-- Информация о папке -->
    <div class="folder-info">
        <h2><i class="fas fa-folder-open"></i> <span th:text="${currentFolderName != null ? currentFolderName : 'Папка'}">Папка</span></h2>
        <p><i class="fas fa-hashtag"></i> ID папки: <span th:text="${folderId}">folder-123</span></p>
        <p><i class="fas fa-chart-bar"></i> Всего файлов: <span th:text="${folderFiles != null ? folderFiles.size() : 0}">0</span></p>
    </div>



    <!-- Заголовок раздела файлов -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin: 30px 0 20px;">
        <h2 style="color: #333; margin: 0;">
            <i class="fas fa-files"></i> Файлы в папке
        </h2>
        <a href="/ui/upload-form" class="btn btn-primary" style="background: #667eea; color: white; padding: 10px 20px;">
            <i class="fas fa-upload"></i> Загрузить файл
        </a>
    </div>



    <!-- Пустое состояние -->
    <div th:if="${folderFiles == null or folderFiles.empty}" class="empty-state">
        <i class="fas fa-folder-open"></i>
        <h3>В этой папке пока нет файлов</h3>
        <p>Загрузите первый файл, чтобы начать работу</p>
        <a href="/ui/upload-form" class="btn btn-primary" style="background: #667eea; color: white; padding: 12px 30px; text-decoration: none; border-radius: 5px;">
            <i class="fas fa-upload"></i> Загрузить файл
        </a>
    </div>

    <!-- Кнопка назад -->
    <div style="margin-top: 30px; text-align: center;">
        <a th:if="${currentFolder != null and currentFolder.parentId != null}"
           th:href="@{'/ui/folders/' + ${currentFolder.parentId}}"
           class="btn btn-back">
            <i class="fas fa-arrow-left"></i> Назад
        </a>
        <a th:if="${currentFolder == null or currentFolder.parentId == null}"
           th:href="@{/ui/folders}"
           class="btn btn-back">
            <i class="fas fa-arrow-left"></i> Назад к папкам
        </a>
    </div>
</div>
</body>
</html>
