<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Страница авторизации</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
<h1>Авторизация пользователя!</h1>

<!-- Показываем ошибку если есть -->
<div th:if="${param.error}" style="color: red;">
    Неверный email или пароль!
</div>

<form action="/user/authenticate" method="post">
    <!-- ✅ CSRF токен (обязательно для Spring Security) -->
<!--    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />-->

    <label for="username">Email:</label>  <!-- ✅ id и name = "username" -->
    <input type="text" id="username" name="username" required>  <!-- ✅ type="email" -->

    <label for="password">Пароль:</label>
    <input type="text" id="password" name="password" required>  <!-- ✅ type="password" -->

    <button type="submit">Войти</button>
</form>

<p>Нет аккаунта? <a href="/register">Зарегистрироваться</a></p>
</body>
</html>
