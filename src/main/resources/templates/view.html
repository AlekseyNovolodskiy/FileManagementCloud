<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${currentFolder.name}">Папка</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f5f5f5; }
        .header { background: linear-gradient(135deg, #667eea, #764ba2); color: white; padding: 20px; border-radius: 10px; margin-bottom: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }

        /* Хлебные крошки */
        .breadcrumb {
            background: white;
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .breadcrumb a { color: #667eea; text-decoration: none; margin-right: 5px; }
        .breadcrumb a:hover { text-decoration: underline; }
        .breadcrumb .separator { color: #999; margin: 0 5px; }

        /* Форма создания */
        .create-form {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            border: 1px solid #e0e0e0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .form-group { display: flex; gap: 10px; }
        input[type=text] {
            flex: 1;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
        }
        input[type=text]:focus { border-color: #667eea; outline: none; }

        /* Сетки */
        .section-title {
            margin: 30px 0 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #333;
        }
        .folder-grid, .files-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        /* Карточки папок */
        .folder-card {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s ease;
            cursor: pointer;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .folder-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.2);
            border-color: #667eea;
        }
        .folder-icon { font-size: 48px; margin-bottom: 10px; }
        .folder-name { font-weight: bold; color: #333; }

        /* Карточки файлов */
        .file-card {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s ease;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .file-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.2);
            border-color: #667eea;
        }
        .file-icon { font-size: 48px; margin-bottom: 10px; }
        .file-name { font-weight: bold; color: #333; word-break: break-word; margin-bottom: 10px; }
        .file-actions { display: flex; justify-content: center; gap: 10px; }

        /* Кнопки */
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }
        .btn-download {
            background: #4CAF50;
            color: white;
        }
        .btn-delete {
            background: #f44336;
            color: white;
        }

        /* Пустое состояние */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            background: white;
            border-radius: 12px;
            border: 2px dashed #e0e0e0;
        }
        .empty-state i { font-size: 64px; color: #ddd; margin-bottom: 20px; }

        /* Кнопки навигации */
        .nav-buttons { margin-top: 20px; display: flex; gap: 10px; }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
<div class="container">
    <!-- Хлебные крошки -->
    <div class="breadcrumb">
        <a href="/ui/folders"><i class="fas fa-home"></i> Корень</a>
        <span th:each="folder, iterStat : ${breadcrumbs}">
            <span class="separator">›</span>
            <span th:if="${iterStat.last}" th:text="${folder.name}"></span>
            <a th:if="${!iterStat.last}" th:href="@{'/ui/folders/' + ${folder.id}}" th:text="${folder.name}"></a>
        </span>
    </div>

    <!-- Заголовок -->
    <div class="header">
        <h1><i class="fas fa-folder-open"></i> <span th:text="${currentFolder.name}">Папка</span></h1>
        <p>ID: <span th:text="${currentFolder.id}">folder-id</span></p>
    </div>

    <!-- Форма создания подпапки -->
    <div class="create-form">
        <h3><i class="fas fa-folder-plus"></i> Создать подпапку в <span th:text="${currentFolder.name}"></span></h3>
        <form th:action="@{/ui/create}" method="post" class="form-group">
            <input type="text" name="folderName" placeholder="Введите название папки" required />
            <input type="hidden" name="parentId" th:value="${parentId}" />
            <button type="submit" class="btn btn-primary">
                <i class="fas fa-plus"></i> Создать
            </button>
        </form>
    </div>

    <!-- СЕКЦИЯ ПОДПАПОК -->
    <div th:if="${subfolders != null and !subfolders.empty}">
        <h2 class="section-title">
            <i class="fas fa-folder"></i> Подпапки
            <span style="font-size: 14px; color: #666;" th:text="'(' + ${subfolders.size()} + ')'"></span>
        </h2>
        <div class="folder-grid">
            <div th:each="folder : ${subfolders}" class="folder-card"
                 onclick="window.location.href='/ui/folders/' + '[[${folder.id}]]'">
                <div class="folder-icon">📁</div>
                <div class="folder-name" th:text="${folder.name}">Название</div>
            </div>
        </div>
    </div>

    <!-- СЕКЦИЯ ФАЙЛОВ (НОВАЯ) -->
    <div th:if="${folderFiles != null and !folderFiles.empty}">
        <h2 class="section-title">
            <i class="fas fa-file"></i> Файлы
            <span style="font-size: 14px; color: #666;" th:text="'(' + ${folderFiles.size()} + ')'"></span>
        </h2>
        <div class="files-grid">
            <div th:each="file : ${folderFiles}" class="file-card">
                <div class="file-icon">
                    <i th:if="${file.name != null and (file.name.endsWith('.pdf') or file.name.endsWith('.PDF'))}"
                       class="fas fa-file-pdf" style="color: #e74c3c;"></i>
                    <i th:if="${file.name != null and (file.name.endsWith('.jpg') or file.name.endsWith('.jpeg') or file.name.endsWith('.png'))}"
                       class="fas fa-file-image" style="color: #3498db;"></i>
                    <i th:if="${file.name != null and (file.name.endsWith('.txt'))}"
                       class="fas fa-file-alt" style="color: #7f8c8d;"></i>
                    <i th:if="${file.name != null and !file.name.endsWith('.pdf') and !file.name.endsWith('.jpg') and !file.name.endsWith('.jpeg') and !file.name.endsWith('.png') and !file.name.endsWith('.txt')}"
                       class="fas fa-file" style="color: #95a5a6;"></i>
                </div>
                <div class="file-name" th:text="${file.name}">file.txt</div>
                <div class="file-actions">
                    <a th:href="@{'/main/download?fileName=' + ${file.name}}" class="btn btn-download">
                        <i class="fas fa-download"></i> Скачать
                    </a>
                    <a th:href="@{'/files/delete/' + ${file.id}}" class="btn btn-delete"
                       onclick="return confirm('Удалить файл?')">
                        <i class="fas fa-trash"></i> Удалить
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Пустое состояние (если нет ни папок, ни файлов) -->
    <div th:if="${(subfolders == null or subfolders.empty) and (folderFiles == null or folderFiles.empty)}"
         class="empty-state">
        <i class="fas fa-folder-open"></i>
        <h3>В этой папке пока ничего нет</h3>
        <p>Создайте подпапку или загрузите файл</p>
    </div>

    <!-- Кнопки навигации -->
    <div class="nav-buttons">
        <a th:if="${currentFolder.parentId != null}"
           th:href="@{'/ui/folders/' + ${currentFolder.parentId}}"
           class="btn btn-primary">
            <i class="fas fa-arrow-left"></i> Назад
        </a>
        <a th:if="${currentFolder.parentId == null}"
           th:href="@{/ui/folders}"
           class="btn btn-primary">
            <i class="fas fa-arrow-left"></i> Назад к корневым папкам
        </a>
    </div>
</div>
</body>
</html>
