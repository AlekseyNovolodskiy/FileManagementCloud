<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${currentFolder.name}">Папка</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .header { background: #f0f0f0; padding: 10px; margin-bottom: 20px; }
        .folder-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; }
        .folder-card {
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .folder-card:hover {
            background: #e3f2fd;
            border-color: #2196f3;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .folder-icon { font-size: 48px; text-align: center; margin-bottom: 10px; }
        .folder-name { font-weight: bold; text-align: center; }
        .folder-info { font-size: 12px; color: #666; text-align: center; margin-top: 5px; }
        .create-form {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 5px;
            margin-bottom: 30px;
            border: 1px solid #ddd;
        }
        .breadcrumb {
            padding: 10px 0;
            margin-bottom: 20px;
            border-bottom: 1px solid #eee;
        }
        .breadcrumb a {
            color: #2196f3;
            text-decoration: none;
            margin-right: 5px;
        }
        .breadcrumb a:hover { text-decoration: underline; }
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        .btn-primary { background: #2196f3; color: white; }
        .btn-primary:hover { background: #1976d2; }
        input[type=text] {
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            width: 300px;
            margin-right: 10px;
        }
        .empty-state {
            text-align: center;
            padding: 50px;
            color: #666;
            background: #f9f9f9;
            border-radius: 5px;
        }
    </style>
</head>
<body>
<div class="header">
    <h1>Мой облачный диск</h1>
</div>


<!-- Список файлов -->
<h2>Файлы</h2>

    <div th:each="folder : ${subfolders}" class="folder-card">
        <a th:href="@{'/ui/display-files/' + ${folder.id}}"
           style="text-decoration: none; color: inherit; display: block;">
            <div class="folder-icon">📁</div>
            <div class="folder-name" th:text="${folder.name}">Название</div>
        </a>
    </div>

<!-- Если подпапок нет -->
<div th:if="${subfolders == null or subfolders.empty}" class="empty-state">
    <p>📁 В этой папке пока нет подпапок</p>
    <p>Создайте первую подпапку с помощью формы выше</p>
</div>

<!-- Кнопка назад -->
<div style="margin-top: 20px;">
    <a th:if="${currentFolder.parentId != null}"
       th:href="@{'/ui/folders/' + ${currentFolder.parentId}}"
       class="btn btn-primary">
        ← Назад
    </a>
    <a th:if="${currentFolder.parentId == null}"
       th:href="@{/ui/folders}"
       class="btn btn-primary">
        ← Назад к корневым папкам
    </a>
</div>

<!-- Форма выхода -->
<form action="/logout" method="post" style="margin-top: 20px;">
    <button type="submit" class="btn" style="background: #f44336; color: white;">Выйти</button>
</form>
</body>
</html>
