version: "3.9"

services:
  pg_db:
    image: postgres:15-alpine
    container_name: cloud-postgres
    restart: always
    environment:
      POSTGRES_DB: cloud_db
      POSTGRES_USER: docker
      POSTGRES_PASSWORD: docker
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5455:5432"
    networks:
      - cloud-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docker -d cloud_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: cloud-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin           # логин для MinIO
      MINIO_ROOT_PASSWORD: password123 # пароль для MinIO
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"  # API порт (S3-совместимый)
      - "9001:9001"  # Web UI порт (консоль управления)
    networks:
      - cloud-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local

networks:
  cloud-network:
    driver: bridge